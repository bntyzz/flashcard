<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flashcard de Venta</title>

  <!-- Bootstrap CSS (guía, Sección 4) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Tipografías tipo cartel -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

  <style>
    :root {
      --oro: #e8b84b;
      --fondo: #0d0d0d;
      --tarjeta: #141414;
    }

    body {
      background-color: var(--fondo);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
    }

    .flashcard {
      max-width: 460px;
      background-color: var(--tarjeta);
      border: 1px solid #262626;
      border-radius: 6px;
      overflow: hidden;
      transition: transform 0.2s ease;   /* hover pedido por la guía */
    }
    .flashcard:hover { transform: translateY(-4px); }

    /* Imagen del producto */
    .flashcard__img {
      position: relative;
      height: 380px;
      background-size: cover;
      background-position: center;
      background-color: #1a1a1a; /* color de respaldo mientras no hay foto */
    }
    .flashcard__img::after {
      content: "";
      position: absolute; inset: 0;
      background: linear-gradient(to bottom, rgba(20,20,20,0) 55%, var(--tarjeta) 100%);
    }

    /* Badge "3 left · REISSUE" */
    .badge-stock {
      position: absolute; top: 18px; left: 18px; z-index: 2;
      background-color: rgba(0,0,0,0.65);
      border: 1px solid var(--oro);
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 0.72rem; letter-spacing: 1px;
      color: #cfcfcf;
    }
    .badge-stock strong { color: var(--oro); margin-left: 6px; }

    /* Texto */
    .flashcard__body { padding: 0 1.75rem 1.75rem; }
    .eyebrow {
      font-size: 0.72rem; letter-spacing: 2px; text-transform: uppercase;
      color: #8a8a8a; margin-bottom: 0.4rem;
    }
    .titulo {
      font-family: 'Oswald', sans-serif; font-weight: 700;
      line-height: 0.95; margin: 0;
    }
    .titulo .marca  { color: #ffffff; font-size: 2.1rem; display: block; }
    .titulo .modelo { color: var(--oro); font-size: 2.4rem; display: block; }

    .specs {
      font-size: 0.74rem; letter-spacing: 1.5px; text-transform: uppercase;
      color: #6f6f6f; margin: 0.9rem 0 0.6rem;
    }
    .desc {
      font-style: italic; color: #9a9a9a;
      font-size: 0.92rem; line-height: 1.5; margin-bottom: 1.4rem;
    }

    /* Precios y botón */
    .precio-fila {
      display: flex; align-items: center; justify-content: space-between;
      gap: 1rem; flex-wrap: wrap;
    }
    .precio-actual {
      font-family: 'Oswald', sans-serif; font-weight: 700;
      font-size: 2.3rem; color: #ffffff;
    }
    .precio-actual small { font-size: 1.3rem; vertical-align: super; }
    .precio-viejo {
      color: #6f6f6f; text-decoration: line-through;
      margin-left: 0.5rem; font-size: 1.1rem;
    }
    .descuento { font-size: 0.78rem; color: #8a8a8a; margin-top: 0.2rem; }

    .btn-comprar {
      background-color: var(--oro); color: #1a1a1a;
      font-weight: 700; letter-spacing: 2px;
      border: none; border-radius: 999px;
      padding: 0.9rem 2.2rem;
      box-shadow: 0 0 25px rgba(232,184,75,0.45);
      transition: box-shadow 0.2s ease;
    }
    .btn-comprar:hover { box-shadow: 0 0 35px rgba(232,184,75,0.7); color: #1a1a1a; }
  </style>
</head>
<body>

  <section class="container d-flex justify-content-center align-items-center" style="min-height:100vh;">

    <article class="flashcard">

      <!-- Imagen: reemplaza la URL de abajo por tu propia foto -->
      <div class="flashcard__img" style="background-image:url('guitarra.jpeg');">
        <span class="badge-stock">3 left <strong>REISSUE</strong></span>
      </div>

      <div class="flashcard__body">
        <p class="eyebrow">Guitarra eléctrica</p>

        <h2 class="titulo">
          <span class="marca">GIBSON</span>
          <span class="modelo">LES PAUL</span>
        </h2>

        <p class="specs">Sunburst · Mahogany · Burstbucker Pro</p>

        <p class="desc">
          Caoba maciza, mástil de nitrocelulosa vintage y pastillas
          bobinadas a mano. El sonido que definió el rock.
        </p>

        <div class="precio-fila">
          <div>
            <span class="precio-actual">$3.4<small>99</small></span>
            <span class="precio-viejo">$3.999</span>
            <div class="descuento">−12% · Envío gratis</div>
          </div>
          <button class="btn-comprar">COMPRAR</button>
        </div>
      </div>

    </article>

  </section>

  <!-- Bootstrap JS (guía, Sección 4) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
